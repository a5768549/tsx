name: Verify symlink entry candidate
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  candidate:
    name: ${{ matrix.mode }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: candidate, node: '18.20.8'}
          - {mode: candidate, node: '20.20.2'}
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4473971f4b3261de253209b148d8fdc43269fcc4
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.15.0
      - name: Record checkout provenance
        run: |
          git rev-parse HEAD
          node --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild required native dependencies
        run: pnpm rebuild esbuild node-pty
      - name: Apply frozen patch
        if: matrix.mode == 'candidate'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python -c "import os,base64,pathlib;pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch').write_bytes(base64.b64decode('' if os.environ['MODE']=='old-production' else ''))"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git rev-parse HEAD
          node --version
          python -c 'import hashlib,pathlib,json; paths=["src/cjs/api/module-extensions.ts", "src/esm/hook/load.ts", "src/esm/hook/resolve.ts", "src/esm/hook/utils.ts", "tests/specs/cli.ts", "tests/specs/esm-hook-resolve.ts"]; print("SOURCE_HASHES",json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}))'
      - name: Build with project runtime
        run: pnpm build
      - name: Select compatibility runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Retained native entry regressions
        env:
          TESTONLY: symlink
        run: node ./dist/cli.mjs tests/index.ts
      - name: Native CLI matrix
        if: always() && matrix.mode == 'candidate'
        run: |
          python -c "import base64,pathlib,os;pathlib.Path(os.environ['RUNNER_TEMP'],'probe.cjs').write_bytes(base64.b64decode(''))"
          set +e
          node "$RUNNER_TEMP/probe.cjs" "$PWD/dist/cli.mjs" "$RUNNER_TEMP/probe" > "$RUNNER_TEMP/probe.log" 2>&1
          result=$?
          set -e
          echo "DIAGNOSTIC_EXIT=$result"
          python -c 'import os,pathlib,hashlib,base64,zlib; b=pathlib.Path(os.environ["RUNNER_TEMP"],"probe/results.json").read_bytes(); print("RESULT_SHA256",hashlib.sha256(b).hexdigest()); print("RESULT_ZLIB_BASE64",base64.b64encode(zlib.compress(b)).decode())'
          exit "$result"
      - name: Verify final source
        if: always() && matrix.mode == 'candidate'
        run: |
          git diff --check
          python -c 'import pathlib,hashlib,json; expected={"src/cjs/api/module-extensions.ts": "48d57b0986e52fc0f1e1f51615ce6e51db9698555f2e2d6fc6b71936eebc7db7", "src/esm/hook/load.ts": "373ea338b3c12167790fd1d82953701afd459007f43a22f20767882475b3306c", "src/esm/hook/resolve.ts": "edbfb168d4037799d4e824bc122d6a80011a6264e602e00e64237fd36d677dd5", "src/esm/hook/utils.ts": "3a876f560637398be9c6261ef503dd1f2dbf8397bd6247d1cbdf3fdfb63d96bd", "tests/specs/cli.ts": "7585b9fde3ce296c32aeed067c34bb95ced5fb16fbf5559381fa6b7f488e7441", "tests/specs/esm-hook-resolve.ts": "46dfb47eac6eedad0677dc9b8d5e8b9c6b225ec016fd08d4d0b057a5bd43a03e"}; actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected}; print("FINAL_SOURCE_HASHES",json.dumps(actual)); assert actual==expected'
