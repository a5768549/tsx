name: Verify symlink entry candidate
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  candidate:
    name: ${{ matrix.mode }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: candidate, node: '20.20.2'}
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4473971f4b3261de253209b148d8fdc43269fcc4
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24.15.0
      - name: Record checkout provenance
        run: |
          git rev-parse HEAD
          node --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild required native dependencies
        run: pnpm rebuild esbuild node-pty
      - name: Apply frozen patch
        if: matrix.mode == 'candidate'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python -c "import os,base64,pathlib;pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch').write_bytes(base64.b64decode('' if os.environ['MODE']=='old-production' else ''))"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git rev-parse HEAD
          node --version
          python -c 'import hashlib,pathlib,json; paths=["src/cjs/api/module-extensions.ts", "src/esm/api/register.ts", "src/esm/hook/initialize.ts", "src/esm/hook/load.ts", "src/esm/hook/resolve.ts", "src/esm/hook/utils.ts", "tests/specs/cli.ts", "tests/specs/esm-hook-resolve.ts"]; print("SOURCE_HASHES",json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}))'
      - name: Build with project runtime
        run: pnpm build
      - name: Select compatibility runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Native CJS entry identity
        run: |
          python -c "import base64,pathlib,os;pathlib.Path(os.environ['RUNNER_TEMP'],'audit.cjs').write_bytes(base64.b64decode(''))"
          python -c "import base64,pathlib,os;pathlib.Path(os.environ['RUNNER_TEMP'],'fixture.cjs').write_bytes(base64.b64decode(''))"
          node "$RUNNER_TEMP/fixture.cjs"
          node ./dist/cli.mjs --require "$RUNNER_TEMP/audit.cjs" "$RUNNER_TEMP/main.ts"
      - name: Verify final source
        if: always() && matrix.mode == 'candidate'
        run: |
          git diff --check
          python -c 'import pathlib,hashlib,json; expected={"src/cjs/api/module-extensions.ts": "04a2a9f103a36141a5baa5a16b38e1949033bd949759710ff059924095e8db11", "src/esm/api/register.ts": "e8c7d1f50ce59ed7881a37eeb5ebebc421f293327dff32dbaa21782964ee8eda", "src/esm/hook/initialize.ts": "8bd7c14ce357b4765559b235c9e19dc7d8d82a47039a91b199db6703d854db9f", "src/esm/hook/load.ts": "a5ba1ac04af8650fb2cc08d33b3a91a9c1f27d65cc7e2156c4b855e15bc42bca", "src/esm/hook/resolve.ts": "d95564496d207ad3f6bc9cf736e899542b7814646d0f03587596268ed20f64e8", "src/esm/hook/utils.ts": "1feaf7371779bee3b55712117819bee741c935a95ac5e4e2319652c5790f3fdd", "tests/specs/cli.ts": "7585b9fde3ce296c32aeed067c34bb95ced5fb16fbf5559381fa6b7f488e7441", "tests/specs/esm-hook-resolve.ts": "89f077189cf28ef5967d877311d8fdfe8a8dbc11d4024f0cf4ed3816326a6021"}; actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected}; print("FINAL_SOURCE_HASHES",json.dumps(actual)); assert actual==expected'
