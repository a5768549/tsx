name: Isolated symlink issue reproduction
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  reproduce:
    name: baseline symlink / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.15.0', '26.1.0']
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4473971f4b3261de253209b148d8fdc43269fcc4
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          node --version
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      - name: Run native symlink diagnostic
        run: |
          python -c "import base64,os,pathlib;pathlib.Path(os.environ['RUNNER_TEMP'],'reproduce-706.cjs').write_bytes(base64.b64decode(''))"
          set +e
          node "$RUNNER_TEMP/reproduce-706.cjs" "$PWD/dist/cli.mjs" "$RUNNER_TEMP/diagnostic" > "$RUNNER_TEMP/diagnostic.log" 2>&1
          result=$?
          set -e
          echo "DIAGNOSTIC_EXIT=$result"
          python -c 'import os,json,pathlib,hashlib,base64,zlib; p=pathlib.Path(os.environ["RUNNER_TEMP"],"diagnostic/results.json"); raw=p.read_bytes(); d=json.loads(raw); print("RESULT_SHA256",hashlib.sha256(raw).hexdigest()); print("RESULT_ZLIB_BASE64",base64.b64encode(zlib.compress(raw)).decode()); print("CASE_SUMMARY",json.dumps([{"type":c["type"],"syntax":c["syntax"],"name":c["name"],"status":c["status"],"stdout":c["stdout"],"stderr":c["stderr"][:220]} for c in d["cases"]])); print("NATIVE_SYMLINK",d.get("nativeSymlink"))'
          exit "$result"
      - name: Verify source unchanged
        if: always()
        run: git diff --exit-code
